<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>扑克牌凑数 · 数据看板 | 排行榜 & 班级统计</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: #f5f9ff;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.6rem;
            color: #699e7c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            font-weight: 600;
        }
        .sub {
            font-size: 0.7rem;
            color: #78909c;
            margin-top: 6px;
        }
        .refresh-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #78909c;
        }
        .refresh-btn {
            background: #e3f2fd;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #699e7c;
            transition: 0.1s;
            font-weight: 500;
        }
        .refresh-btn:active {
            background: #c8e6df;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: white;
            border: 1px solid #e3f2fd;
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #5c6f87;
            cursor: pointer;
            transition: 0.1s;
        }
        .tab-btn.active {
            background: #699e7c;
            border-color: #699e7c;
            color: white;
            box-shadow: 0 2px 6px rgba(105,158,124,0.2);
        }

        .class-stats {
            background: white;
            border-radius: 24px;
            padding: 12px 12px;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
            border: 1px solid #e3f2fd;
        }
        .stats-scroll {
            display: inline-flex;
            gap: 10px;
        }
        .class-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 8px 14px;
            min-width: 110px;
            text-align: center;
            display: inline-block;
            cursor: pointer;
            border: 1px solid #e3f2fd;
        }
        .class-card.active {
            background: #e3f2fd;
            border-color: #699e7c;
        }
        .class-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: #699e7c;
        }
        .class-count {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a2c3e;
        }
        .class-rate {
            font-size: 0.6rem;
            color: #5c9e6b;
        }
        .class-avgtime {
            font-size: 0.55rem;
            color: #f39c12;
            margin-top: 2px;
        }

        .column-control {
            background: white;
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #e3f2fd;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #5c6f87;
            cursor: pointer;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .control-item i {
            color: #699e7c;
        }
        .control-item.hidden {
            background: #f0f4f9;
            color: #90a4c3;
        }
        .best-toggle {
            background: #e8eaf6;
            color: #3949ab;
        }
        .best-toggle.active {
            background: #3949ab;
            color: white;
        }

        .data-table {
            background: white;
            border-radius: 28px;
            overflow-x: auto;
            margin-bottom: 20px;
            border: 1px solid #e3f2fd;
        }
        .table-header {
            display: grid;
            grid-template-columns: 0.6fr 0.9fr 1fr 0.8fr 0.7fr 1.2fr;
            background: #fafcff;
            padding: 12px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #699e7c;
            border-bottom: 1px solid #e3f2fd;
            min-width: 650px;
        }
        .sortable-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sortable-header i {
            font-size: 0.6rem;
            color: #64b5f6;
        }
        .table-row {
            display: grid;
            grid-template-columns: 0.6fr 0.9fr 1fr 0.8fr 0.7fr 1.2fr;
            padding: 10px 14px;
            font-size: 0.7rem;
            border-bottom: 1px solid #eff4fa;
            align-items: center;
            min-width: 650px;
        }
        .cell {
            word-break: break-word;
            color: #2c3e50;
        }
        .cell-class {
            font-weight: 500;
            color: #699e7c;
        }
        .cell-correct {
            font-weight: 500;
            color: #5c9e6b;
        }
        .rank-badge {
            background: #eef2fa;
            border-radius: 40px;
            padding: 2px 8px;
            font-weight: 600;
            display: inline-block;
            text-align: center;
            font-size: 0.7rem;
        }
        .empty-row {
            text-align: center;
            padding: 32px;
            color: #90a4c3;
            font-size: 0.75rem;
        }

        .hide-rank .col-rank,
        .hide-class .col-class,
        .hide-name .col-name,
        .hide-correct .col-correct,
        .hide-time .col-time,
        .hide-date .col-date {
            display: none;
        }

        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: #90a4c3;
            padding: 12px 0;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1><i class="fas fa-calculator"></i> 扑克牌凑数 · 数据看板</h1>
        <div class="sub" id="gameSubTitle">🃏 简单模式 · 学生成绩排名 | 仅显示最佳成绩</div>
        <div class="refresh-bar">
            <i class="fas fa-sync-alt"></i>
            <span id="autoRefreshTip">自动刷新 15秒</span>
            <button class="refresh-btn" id="manualRefreshBtn"><i class="fas fa-arrows-rotate"></i> 刷新</button>
        </div>
    </div>

    <!-- 选项卡：简单/困难模式 -->
    <div class="tabs">
        <button class="tab-btn active" data-game="easy">✨ 简单模式</button>
        <button class="tab-btn" data-game="hard">🔥 困难模式</button>
    </div>

    <!-- 班级统计卡片区域 -->
    <div class="class-stats">
        <div class="stats-scroll" id="classStatsScroll"></div>
    </div>

    <!-- 列显示控制 / 仅最佳成绩 -->
    <div class="column-control">
        <div class="control-item best-toggle active" id="bestOnlyBtn">
            <i class="fas fa-star"></i> 仅最佳成绩
        </div>
        <div class="control-item" id="toggleRankBtn"><i class="fas fa-eye"></i> 排名</div>
        <div class="control-item" id="toggleClassBtn"><i class="fas fa-eye"></i> 班级</div>
        <div class="control-item" id="toggleNameBtn"><i class="fas fa-eye"></i> 姓名</div>
        <div class="control-item" id="toggleCorrectBtn"><i class="fas fa-eye"></i> 正确/总数</div>
        <div class="control-item" id="toggleTimeBtn"><i class="fas fa-eye"></i> 用时(秒)</div>
        <div class="control-item" id="toggleDateBtn"><i class="fas fa-eye"></i> 时间</div>
    </div>

    <!-- 数据表格 -->
    <div class="data-table" id="dataTable">
        <div class="table-header">
            <div class="col-rank sortable-header" data-sort="rank">排名 <i class="fas fa-sort"></i></div>
            <div class="col-class sortable-header" data-sort="class">班级 <i class="fas fa-sort"></i></div>
            <div class="col-name sortable-header" data-sort="name">姓名 <i class="fas fa-sort"></i></div>
            <div class="col-correct sortable-header" data-sort="correct">正确/总数 <i class="fas fa-sort"></i></div>
            <div class="col-time sortable-header" data-sort="time">用时(秒) <i class="fas fa-sort"></i></div>
            <div class="col-date sortable-header" data-sort="date">提交时间 <i class="fas fa-sort"></i></div>
        </div>
        <div id="tableBody"></div>
    </div>

    <div class="footer-note">
        <i class="far fa-clock"></i> 排名基于每个学生的最好成绩（正确数优先，相同时用时更短）<br>
        “仅最佳成绩”模式：每个学生只显示最优的一条记录，便于公平排名
    </div>
</div>

<script>
    // ================= 游戏 API 配置 =================
    const API_CONFIG = {
        easy: {
            name: '简单模式',
            url: 'https://quickform.cn/api/qo3ux2czpi/all',
            sub: '🃏 简单模式 · 学生成绩排名 | 仅显示最佳成绩'
        },
        hard: {
            name: '困难模式',
            url: 'https://quickform.cn/api/q12gcimniu/all',
            sub: '🔥 困难模式 · 学生成绩排名 | 仅显示最佳成绩'
        }
    };
    
    let currentGame = 'easy';
    let autoRefreshInterval = null;
    let allSubmissions = [];      // 原始所有提交记录（标准化后）
    let workingData = [];          // 当前使用的数据（原始数据副本）
    let filteredSubmissions = [];   // 经过班级过滤和排序后的数据
    
    let onlyBest = true;           // 默认仅显示最佳成绩
    let studentRankMap = new Map();   // key -> 排名
    
    let visibleColumns = {
        rank: true, class: true, name: true, correct: true, time: true, date: true
    };
    let sortState = { field: 'date', order: 'desc' };
    let currentClassFilter = 'all';
    
    const classStatsScroll = document.getElementById('classStatsScroll');
    const tableBody = document.getElementById('tableBody');
    const dataTable = document.getElementById('dataTable');
    const bestOnlyBtn = document.getElementById('bestOnlyBtn');
    const gameSubTitle = document.getElementById('gameSubTitle');
    const tabBtns = document.querySelectorAll('.tab-btn');
    
    // ========== 辅助函数 ==========
    function formatDateTime(dateStr) {
        if (!dateStr) return '—';
        try {
            let d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        } catch(e) { return dateStr; }
    }
    
    function isValidName(name) {
        if (!name || typeof name !== 'string') return false;
        const trimmed = name.trim();
        if (trimmed.length < 2) return false;
        return /[\u4e00-\u9fa5a-zA-Z]/.test(trimmed);
    }
    
    // 从原始提交记录中标准化数据（兼容不同字段名）
    function normalizeRecord(raw) {
        // 兼容多种可能的字段命名
        const className = raw.class || raw.className || '未知班级';
        const studentName = raw.name || raw.studentName || '匿名';
        const correctAnswers = raw.correctCount ?? raw.correct ?? raw.correctAnswers ?? 0;
        const totalTimeSeconds = raw.timeSeconds ?? raw.time ?? raw.totalTimeSeconds ?? 0;
        const totalQuestions = raw.totalQuestions ?? 5;
        const submitted_at = raw.timestamp || raw.submitted_at || new Date().toISOString();
        return {
            className: String(className),
            studentName: String(studentName),
            correctAnswers: Number(correctAnswers),
            totalTimeSeconds: Number(totalTimeSeconds),
            totalQuestions: Number(totalQuestions),
            submitted_at: submitted_at
        };
    }
    
    // 聚合每个学生的最佳成绩 (正确数优先，相同时用时短)
    function computeStudentBestMap(data) {
        const bestMap = new Map();
        data.forEach(item => {
            const className = item.className || '未知班级';
            const studentName = item.studentName || '匿名';
            if (!isValidName(studentName)) return;
            const key = `${className}|${studentName}`;
            const correct = item.correctAnswers ?? 0;
            const time = item.totalTimeSeconds ?? 9999;
            const total = item.totalQuestions ?? 5;
            if (!bestMap.has(key)) {
                bestMap.set(key, { className, studentName, correct, time, total, submitted_at: item.submitted_at });
            } else {
                const existing = bestMap.get(key);
                if (correct > existing.correct || (correct === existing.correct && time < existing.time)) {
                    bestMap.set(key, { className, studentName, correct, time, total, submitted_at: item.submitted_at });
                }
            }
        });
        return bestMap;
    }
    
    function bestMapToArray(bestMap) {
        return Array.from(bestMap.values()).map(item => ({
            className: item.className,
            studentName: item.studentName,
            correctAnswers: item.correct,
            totalTimeSeconds: item.time,
            totalQuestions: item.total,
            submitted_at: item.submitted_at
        }));
    }
    
    // 计算排名列表（基于最佳成绩）
    function computeRankingList(bestMap) {
        const students = Array.from(bestMap.entries()).map(([key, info]) => ({ key, ...info }));
        students.sort((a,b) => {
            if (a.correct !== b.correct) return b.correct - a.correct;
            return a.time - b.time;
        });
        const rankList = [];
        for (let i = 0; i < students.length; i++) {
            rankList.push({ key: students[i].key, rank: i+1 });
        }
        return rankList;
    }
    
    function updateRankMap(data) {
        const bestMap = computeStudentBestMap(data);
        const rankList = computeRankingList(bestMap);
        studentRankMap.clear();
        rankList.forEach(r => studentRankMap.set(r.key, r.rank));
    }
    
    function getRankForRecord(record) {
        const className = record.className || '未知班级';
        const studentName = record.studentName || '匿名';
        const key = `${className}|${studentName}`;
        return studentRankMap.get(key) || '—';
    }
    
    // 班级统计：基于原始所有提交（非最佳成绩）计算提交次数、平均正确率、平均用时
    function computeClassStats(data) {
        const classMap = new Map(); // className -> { totalCorrect, totalQ, totalTime, count }
        data.forEach(sub => {
            const className = sub.className || '未知班级';
            if (!classMap.has(className)) {
                classMap.set(className, { totalCorrect: 0, totalQ: 0, totalTime: 0, count: 0 });
            }
            const stat = classMap.get(className);
            stat.totalCorrect += (sub.correctAnswers || 0);
            stat.totalQ += (sub.totalQuestions || 5);
            stat.totalTime += (sub.totalTimeSeconds || 0);
            stat.count++;
        });
        const stats = [];
        const countMap = new Map();
        data.forEach(sub => {
            const cn = sub.className || '未知班级';
            countMap.set(cn, (countMap.get(cn) || 0) + 1);
        });
        for (let [className, stat] of classMap.entries()) {
            const accuracy = stat.totalQ > 0 ? (stat.totalCorrect / stat.totalQ) * 100 : 0;
            const avgTime = stat.count > 0 ? (stat.totalTime / stat.count).toFixed(1) : '—';
            stats.push({ 
                className, 
                submissionCount: countMap.get(className) || 0, 
                accuracy,
                avgTime: avgTime === '—' ? '—' : avgTime + 's'
            });
        }
        stats.sort((a,b) => a.className.localeCompare(b.className));
        return stats;
    }
    
    function renderClassStats(data) {
        const stats = computeClassStats(data);
        let html = '';
        const totalAll = data.length;
        let totalTimeAll = 0;
        let countAll = 0;
        data.forEach(sub => {
            totalTimeAll += (sub.totalTimeSeconds || 0);
            countAll++;
        });
        const avgTimeAll = countAll > 0 ? (totalTimeAll / countAll).toFixed(1) + 's' : '—';
        const allActive = currentClassFilter === 'all' ? 'active' : '';
        html += `<div class="class-card ${allActive}" data-class="all">
                    <div class="class-name">全部班级</div>
                    <div class="class-count">${totalAll}</div>
                    <div class="class-rate">正确率 —</div>
                    <div class="class-avgtime">⏱️ 平均 ${avgTimeAll}</div>
                </div>`;
        stats.forEach(stat => {
            const active = (currentClassFilter === stat.className) ? 'active' : '';
            html += `<div class="class-card ${active}" data-class="${stat.className}">
                        <div class="class-name">${stat.className}</div>
                        <div class="class-count">${stat.submissionCount}</div>
                        <div class="class-rate">正确率 ${stat.accuracy.toFixed(0)}%</div>
                        <div class="class-avgtime">⏱️ 平均 ${stat.avgTime}</div>
                    </div>`;
        });
        classStatsScroll.innerHTML = html;
        document.querySelectorAll('.class-card').forEach(card => {
            card.addEventListener('click', () => {
                currentClassFilter = card.getAttribute('data-class');
                applyFiltersAndRender();
            });
        });
    }
    
    // 获取当前显示的数据（根据 onlyBest 决定）
    function getDisplayData() {
        if (!onlyBest) return [...workingData];
        const bestMap = computeStudentBestMap(workingData);
        return bestMapToArray(bestMap);
    }
    
    // 过滤和排序
    function filterAndSort(dataToDisplay) {
        let filtered = [...dataToDisplay];
        if (currentClassFilter !== 'all') {
            filtered = filtered.filter(s => s.className === currentClassFilter);
        }
        const { field, order } = sortState;
        filtered.sort((a, b) => {
            let valA, valB;
            switch(field) {
                case 'rank':
                    const rankA = getRankForRecord(a);
                    const rankB = getRankForRecord(b);
                    valA = rankA === '—' ? 9999 : rankA;
                    valB = rankB === '—' ? 9999 : rankB;
                    break;
                case 'class': valA = a.className || ''; valB = b.className || ''; break;
                case 'name': valA = a.studentName || ''; valB = b.studentName || ''; break;
                case 'correct': 
                    valA = (a.correctAnswers || 0) / (a.totalQuestions || 5);
                    valB = (b.correctAnswers || 0) / (b.totalQuestions || 5);
                    break;
                case 'time': valA = a.totalTimeSeconds || 0; valB = b.totalTimeSeconds || 0; break;
                case 'date': valA = new Date(a.submitted_at || 0); valB = new Date(b.submitted_at || 0); break;
                default: return 0;
            }
            if (valA < valB) return order === 'asc' ? -1 : 1;
            if (valA > valB) return order === 'asc' ? 1 : -1;
            return 0;
        });
        return filtered;
    }
    
    function renderTable(data) {
        tableBody.innerHTML = '';
        if (!data || data.length === 0) {
            tableBody.innerHTML = '<div class="empty-row">暂无数据，快去游戏中挑战吧 🃏</div>';
            return;
        }
        let rowsHtml = '';
        data.forEach(item => {
            const correct = item.correctAnswers ?? 0;
            const total = item.totalQuestions ?? 5;
            const rank = getRankForRecord(item);
            rowsHtml += `
                <div class="table-row">
                    <div class="cell col-rank ${!visibleColumns.rank ? 'hidden-col' : ''}"><span class="rank-badge">${rank}</span></div>
                    <div class="cell col-class ${!visibleColumns.class ? 'hidden-col' : ''}">${escapeHtml(item.className || '—')}</div>
                    <div class="cell col-name ${!visibleColumns.name ? 'hidden-col' : ''}">${escapeHtml(item.studentName || '匿名')}</div>
                    <div class="cell col-correct ${!visibleColumns.correct ? 'hidden-col' : ''} cell-correct">${correct}/${total}</div>
                    <div class="cell col-time ${!visibleColumns.time ? 'hidden-col' : ''}">${item.totalTimeSeconds ?? '—'}</div>
                    <div class="cell col-date ${!visibleColumns.date ? 'hidden-col' : ''}">${formatDateTime(item.submitted_at)}</div>
                </div>
            `;
        });
        tableBody.innerHTML = rowsHtml;
        updateTableColumnsVisibility();
        updateSortIcons();
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function updateTableColumnsVisibility() {
        if (!dataTable) return;
        if (!visibleColumns.rank) dataTable.classList.add('hide-rank');
        else dataTable.classList.remove('hide-rank');
        if (!visibleColumns.class) dataTable.classList.add('hide-class');
        else dataTable.classList.remove('hide-class');
        if (!visibleColumns.name) dataTable.classList.add('hide-name');
        else dataTable.classList.remove('hide-name');
        if (!visibleColumns.correct) dataTable.classList.add('hide-correct');
        else dataTable.classList.remove('hide-correct');
        if (!visibleColumns.time) dataTable.classList.add('hide-time');
        else dataTable.classList.remove('hide-time');
        if (!visibleColumns.date) dataTable.classList.add('hide-date');
        else dataTable.classList.remove('hide-date');
    }
    
    function updateSortIcons() {
        const headers = document.querySelectorAll('.sortable-header');
        headers.forEach(header => {
            const field = header.getAttribute('data-sort');
            const icon = header.querySelector('i');
            if (field === sortState.field) {
                icon.className = sortState.order === 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down';
            } else {
                icon.className = 'fas fa-sort';
            }
        });
    }
    
    async function refreshDashboard() {
        const apiUrl = API_CONFIG[currentGame].url;
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(apiUrl, { cache: 'no-cache', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            // 兼容返回格式：{ submissions: [...] } 或直接数组
            let rawList = data.submissions || (Array.isArray(data) ? data : []);
            // 标准化每条记录
            allSubmissions = rawList.map(item => normalizeRecord(item));
            workingData = [...allSubmissions];
            updateRankMap(workingData);
            renderClassStats(workingData);
            applyFiltersAndRender();
        } catch (err) {
            console.error('数据加载失败:', err);
            tableBody.innerHTML = '<div class="empty-row">⚠️ 网络开小差，请稍后刷新</div>';
        }
    }
    
    function applyFiltersAndRender() {
        updateRankMap(workingData);
        const displayData = getDisplayData();
        const sortedFiltered = filterAndSort(displayData);
        filteredSubmissions = sortedFiltered;
        renderTable(sortedFiltered);
        renderClassStats(workingData);
        if (onlyBest) bestOnlyBtn.classList.add('active');
        else bestOnlyBtn.classList.remove('active');
    }
    
    function handleSortClick(field) {
        if (sortState.field === field) {
            sortState.order = sortState.order === 'asc' ? 'desc' : 'asc';
        } else {
            sortState.field = field;
            sortState.order = 'desc';
        }
        applyFiltersAndRender();
    }
    
    function toggleBestOnly() {
        onlyBest = !onlyBest;
        applyFiltersAndRender();
    }
    
    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            refreshDashboard();
        }, 15000);
    }
    
    async function switchGame(gameId) {
        if (currentGame === gameId) return;
        currentGame = gameId;
        onlyBest = true;                 // 切换模式时重置为仅最佳成绩
        currentClassFilter = 'all';
        sortState = { field: 'date', order: 'desc' };
        visibleColumns = { rank: true, class: true, name: true, correct: true, time: true, date: true };
        gameSubTitle.innerText = API_CONFIG[currentGame].sub;
        tabBtns.forEach(btn => {
            if (btn.getAttribute('data-game') === gameId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        await refreshDashboard();
        // 重置列显隐图标
        const toggleMap = {
            toggleRankBtn: 'rank', toggleClassBtn: 'class', toggleNameBtn: 'name',
            toggleCorrectBtn: 'correct', toggleTimeBtn: 'time', toggleDateBtn: 'date'
        };
        for (const [btnId, col] of Object.entries(toggleMap)) {
            const btn = document.getElementById(btnId);
            if (btn) {
                const icon = btn.querySelector('i');
                if (icon) icon.className = visibleColumns[col] ? 'fas fa-eye' : 'fas fa-eye-slash';
                btn.classList.toggle('hidden', !visibleColumns[col]);
            }
        }
    }
    
    function bindControls() {
        document.querySelectorAll('.sortable-header').forEach(header => {
            header.addEventListener('click', () => {
                const field = header.getAttribute('data-sort');
                if (field) handleSortClick(field);
            });
        });
        
        const toggleMap = {
            toggleRankBtn: 'rank', toggleClassBtn: 'class', toggleNameBtn: 'name',
            toggleCorrectBtn: 'correct', toggleTimeBtn: 'time', toggleDateBtn: 'date'
        };
        for (const [btnId, col] of Object.entries(toggleMap)) {
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.addEventListener('click', () => {
                    visibleColumns[col] = !visibleColumns[col];
                    updateTableColumnsVisibility();
                    renderTable(filteredSubmissions);
                    const icon = btn.querySelector('i');
                    if (icon) icon.className = visibleColumns[col] ? 'fas fa-eye' : 'fas fa-eye-slash';
                    btn.classList.toggle('hidden', !visibleColumns[col]);
                });
                const icon = btn.querySelector('i');
                if (icon) icon.className = visibleColumns[col] ? 'fas fa-eye' : 'fas fa-eye-slash';
            }
        }
        
        bestOnlyBtn.addEventListener('click', toggleBestOnly);
        document.getElementById('manualRefreshBtn').addEventListener('click', () => refreshDashboard());
        
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const game = btn.getAttribute('data-game');
                if (game) switchGame(game);
            });
        });
    }
    
    window.addEventListener('load', () => {
        bindControls();
        currentGame = 'easy';
        gameSubTitle.innerText = API_CONFIG.easy.sub;
        refreshDashboard();
        startAutoRefresh();
    });
    window.addEventListener('beforeunload', () => {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    });
</script>
</body>
</html>
